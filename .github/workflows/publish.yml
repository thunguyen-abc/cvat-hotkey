name: Publish extension ZIP

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify version and package extension
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          for script in hotkeys.js complete-next.js update.js updates.js; do
            node --check "$script"
          done
          archive="cvat-event-hotkeys-v$version.zip"
          python -m zipfile -c "$archive" manifest.json hotkeys.js complete-next.js complete-next.css updates.js update.html update.js README.md
          python -m zipfile -t "$archive"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "cvat-event-hotkeys-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "CVAT Event Hotkeys $GITHUB_REF_NAME" --generate-notes
